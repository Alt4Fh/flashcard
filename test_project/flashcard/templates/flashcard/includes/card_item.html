<div class="pagination" id="card">
  <div class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-black bg-opacity-50 rounded-lg shadow-2xl p-8 max-w-md w-full neon-border box-border w-full">
      <h2 class="text-3xl font-bold text-center text-white mb-2 neon-text text capitalize">{{ deck.name }}</h2>
      <p class="text-center text-xs text-teal-300 mb-4">card: {{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</p>
      <p class="mb-8">
          <a href="{% url 'card_update' page_obj.object_list.0.id %}" class="text-center text-lg text-pink-300">{{ page_obj.object_list.0.question }}</a>
        </p>
      <div class="border-t border-pink-500 pt-4 space-y-2">
        <p class="text-white">
          <span class="font-semibold text-pink-300">Answer:</span> {{ page_obj.object_list.0.answer }}
        </p>
      </div>

      <div class="step-links mt-6 flex justify-center space-x-4">
        {% if page_obj.has_previous %}
          <button class="bg-gradient-to-r from-pink-500 to-purple-500 hover:from-pink-600 hover:to-purple-600 text-white text-2xl font-bold py-2 px-8 rounded-full transition duration-300 ease-in-out transform hover:scale-105 neon-border" hx-get="{% url 'deck_detail' deck.id %}?page={{ page_obj.previous_page_number }}" hx-trigger="click" hx-target="#card" hx-swap="outerHTML"><i class="ri-arrow-left-double-fill"></i></button>
       
       {% else %}
       <button class="bg-gradient-to-r from-pink-500 to-purple-500  text-white text-2xl font-bold py-2 px-8 rounded-full" disabled><i class="ri-arrow-left-double-fill"></i></button>

       {% endif %}

        {% if page_obj.has_next %}
          <button class="bg-gradient-to-r from-blue-500 to-teal-500 hover:from-blue-600 hover:to-teal-600 text-white text-2xl font-bold py-2 px-8 rounded-full transition duration-300 ease-in-out transform hover:scale-105 neon-border" hx-get="{% url 'deck_detail' deck.id %}?page={{ page_obj.next_page_number }}" hx-trigger="click" hx-target="#card" hx-swap="outerHTML"><i class="ri-arrow-right-double-fill"></i></button>
        {% else %}
          <button class="bg-gradient-to-r from-blue-500 to-teal-500  text-white text-2xl font-bold py-2 px-8 rounded-full " disabled><i class="ri-arrow-right-double-fill"></i></button>
        {% endif %}
      </div>
    </div>
  </div> <!-- End of card container -->
</div> <!-- End of pagination -->
