<div id="delete-modal" class="fixed inset-0 z-40 min-h-full overflow-y-auto overflow-x-hidden transition flex items-center">
    <!-- overlay -->
    <div aria-hidden="true" class="fixed inset-0 w-full h-full bg-black/85 cursor-pointer">
    </div>
    <!-- Modal -->
    <div class="relative w-full cursor-pointer pointer-events-none transition my-auto p-4">
        <form>
            {% csrf_token %}
            <div
                class="w-full py-2 bg-black bg-opacity-50 cursor-default pointer-events-auto relative rounded-xl mx-auto max-w-sm">

                
                <button tabindex="-1" type="button" class="absolute top-2 right-2 rtl:right-auto rtl:left-2"
                    hx-on:click="document.getElementById('delete-modal').remove()"
                    >
                        <svg title="Close" tabindex="-1" class="h-4 w-4 cursor-pointer text-gray-400"
                        xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                        <path fill-rule="evenodd"
                        d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                        clip-rule="evenodd"></path>
                    </svg>
                    <span class="sr-only">
                        Close
                    </span>
                </button>
                {% comment %} buttonTextGroup will be replaced with message of delete confirmation {% endcomment %}
                <div id="buttonTextGroup" class="text-white text-2xl pl-4">

                        <div class="space-y-2 p-2">
                            <div class="p-4 space-y-2 text-center dark:text-white">
                                <h2 class="text-xl font-bold tracking-tight" id="page-action.heading">
                                    Delete Confirmation
                                </h2>
                                
                                <p class="text-gray-500">
                                    Are you sure you would like to do this ?
                                </p>
                            </div>
                        </div>
                    
                        <div class="space-y-2">
                            <div aria-hidden="true" class="border-t dark:border-gray-700 px-2"></div>
                            
                                <div class="px-6 py-2">
                                    <div class="grid gap-2 grid-cols-[repeat(auto-fit,minmax(0,1fr))]">
                                        <button hx-on:click="document.getElementById('delete-modal').remove()"
                                        class="inline-flex items-center justify-center py-1 gap-1 font-medium rounded-lg border transition-colors outline-none focus:ring-offset-2 focus:ring-2 focus:ring-inset dark:focus:ring-offset-0 min-h-[2.25rem] px-4 text-sm text-gray-800  border-gray-300   bg-gradient-to-r from-green-500 to-teal-500 hover:from-green-600 hover:to-teal-600 dark:bg-gray-800 dark:hover:bg-gray-700 dark:border-gray-600 dark:hover:border-gray-500 dark:text-gray-200 dark:focus:text-primary-400 dark:focus:border-primary-400 dark:focus:bg-gray-800">
                                        <span class="flex items-center gap-1">
                                            <span class="">
                                                Cancel
                                            </span>
                                        </span>
                                    </button>
                                    
                                    <button type="submit"
                                        class="inline-flex items-center justify-center py-1 gap-1 font-medium rounded-lg border transition-colors outline-none focus:ring-offset-2 focus:ring-2 focus:ring-inset dark:focus:ring-offset-0 min-h-[2.25rem] px-4 text-sm text-white shadow focus:ring-white border-transparent bg-gradient-to-r from-red-500 to-[#3c0009] hover:from-red-600 hover:to-[#140003] focus:ring-offset-red-700"
                                        {% if deck.id %}
                                            hx-delete="{% url 'deck-delete' deck.id %}" hx-trigger="click"
                                            hx-on:click="document.getElementById('deck-{{ deck.id }}').remove()"
                                            hx-target="#buttonTextGroup"
                                            hx-swap="innerHTML"
                                        {% else %}
                                            hx-delete="{% url 'card-delete' card.id %}" hx-trigger="click"
                                        
                                        {% endif %}
                                        >
                                        
                                        <span class="flex items-center gap-1">
                                            <span class="">
                                                Confirm
                                            </span>
                                        </span>
                                        
                                    </button>
                                </div>
                            </div>
                        </div>
                </div>
            
            </div>
        </form>
    </div>
</div>
